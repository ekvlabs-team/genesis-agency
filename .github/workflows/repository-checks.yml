name: Repository Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f .github/CODEOWNERS

      - name: No committed local secret files
        run: |
          found="$(find . -path ./.git -prune -o \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -print)"
          if [ -n "$found" ]; then
            echo "$found"
            exit 1
          fi
